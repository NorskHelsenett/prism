services:
  # Mock OIDC Provider
  oidc-mock:
    build:
      context: ./oidc-mock
      dockerfile: Dockerfile
    container_name: prism-test-oidc
    volumes:
      - ./oidc-mock/users.yaml:/config/users.yaml:ro
    environment:
      - ISSUER_URL=http://oidc-mock:9999
      - USERS_CONFIG_PATH=/config/users.yaml
      - PORT=9999
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - test-network

  # Prism API
  prism-api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    container_name: prism-test-api
    volumes:
      - ./config.test.yaml:/config/config.yaml:ro
      - ./test-data:/data
    environment:
      - CONFIG_PATH=/config/config.yaml
      - ROLES_PATH=/app/roles.yaml
      - GIN_MODE=release
      - DATABASE_PATH=/data/test.db
      - GO_ENV="dev"
    depends_on:
      oidc-mock:
        condition: service_healthy
    networks:
      - test-network

  # Test Runner
  test-runner:
    build:
      context: ../..
      dockerfile: .tests/integration/Dockerfile.test
    container_name: prism-test-runner
    volumes:
      - ./fixtures:/workspace/.tests/integration/fixtures:ro
      - ./reports:/workspace/.tests/integration/reports
      - ./benchmark:/workspace/.tests/integration/benchmark
      - ./config.test.yaml:/config/config.yaml:ro
      - ./test-data:/data
    environment:
      - PRISM_API_URL=http://prism-api:8080
      - OIDC_URL=http://oidc-mock:9999
      - FIXTURES_DIR=/workspace/.tests/integration/fixtures
      - CONFIG_PATH=/config/config.yaml
      - DATABASE_PATH=/data/test.db
    depends_on:
      prism-api:
        condition: service_started
      oidc-mock:
        condition: service_healthy
    networks:
      - test-network
    command: /bin/sh -c "sleep 10 && go test -v ./... -timeout 30m"

  # Benchmark Runner
  benchmark-runner:
    build:
      context: ../..
      dockerfile: .tests/integration/Dockerfile.test
    container_name: prism-benchmark-runner
    volumes:
      - ./fixtures:/workspace/.tests/integration/fixtures:ro
      - ./reports:/workspace/.tests/integration/reports
      - ./benchmark:/workspace/.tests/integration/benchmark
    environment:
      - PRISM_API_URL=http://prism-api:8080
      - OIDC_URL=http://oidc-mock:9999
      - FIXTURES_DIR=/workspace/.tests/integration/fixtures
    depends_on:
      prism-api:
        condition: service_started
      oidc-mock:
        condition: service_healthy
    networks:
      - test-network
    command: /bin/sh -c "sleep 10 && go test -bench=. -benchmem -benchtime=10s -timeout 30m"
    profiles:
      - benchmark

networks:
  test-network:
    driver: bridge

volumes:
  test-data:
