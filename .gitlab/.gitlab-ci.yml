image: ubuntu:latest

variables:
  GITLAB_REGISTRY: "registry-helse.nhn.no/jonasbg/prism"
  DOCKER_CONFIG: $PWD/.kaniko/config.json

stages:
  - build
  - deploy

.template: &build_template
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - echo $PWD
    - mkdir -p $PWD/.kaniko/
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > $PWD/.kaniko/config.json
  script: |
    BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
    cat << EOF > web/static/.well-known/buildinfo.json
    {
      "user": "$CI_COMMIT_AUTHOR",
      "branch": "$CI_COMMIT_BRANCH",
      "date": "$BUILD_DATE",
      "digest": "$CI_COMMIT_SHA"
    }
    EOF
    cp CHANGELOG.md web/static/.well-known/CHANGELOG.md

    IMAGE="$GITLAB_REGISTRY/$IMAGE_REPOSITORY"
    if [ "$CI_COMMIT_BRANCH" = "main" ]; then
      DESTINATION="--destination $IMAGE:latest --destination $IMAGE:$(date '+%Y%m%d')"
    else
      DESTINATION="--destination $IMAGE:dev"
    fi

    echo $DESTINATION

    /kaniko/executor \
      --context $CONTEXT_DIR \
      --dockerfile Dockerfile \
      --digest-file /tmp/digest \
      --image-name-with-digest-file /tmp/digest-name \
      --label "build.buildnumber=$CI_JOB_ID" \
      --label "build.builduri=$CI_PIPELINE_URL" \
      --label "build.project.uri=$CI_PROJECT_URL" \
      --label "build.project.name=$CI_PROJECT_PATH" \
      --label "build.repository.name=$CI_PROJECT_NAME" \
      --label "build.repository.branch=$CI_COMMIT_BRANCH" \
      --label "build.repository.commithash=$CI_COMMIT_SHA" \
      --label "maintainer=Jonas Bo Grimsgaard @ NHN <sikkerhet@nhn.no>" \
      --cache=true \
      --reproducible \
      --single-snapshot \
      $DESTINATION

    echo "DIGEST=$(cat /tmp/digest)" >> build.env
  artifacts:
    reports:
      dotenv: build.env

build-api:
  <<: *build_template
  variables:
    IMAGE_REPOSITORY: "api"
    CONTEXT_DIR: "api/"

build-web:
  <<: *build_template
  variables:
    IMAGE_REPOSITORY: "web"
    CONTEXT_DIR: "web/"

deploy-api:
  stage: deploy
  image: ncr.sky.nhn.no/dockerhub/library/alpine
  script:
    - echo "Deploying using API image digest $DIGEST"
    - echo "API_DIGEST=$DIGEST" >> build.env
  artifacts:
    reports:
      dotenv: build.env
  needs:
    - build-api
  dependencies:
    - build-api

deploy-web:
  stage: deploy
  image: ncr.sky.nhn.no/dockerhub/library/alpine
  script:
    - echo "Deploying using API image digest $DIGEST"
    - echo "WEB_DIGEST=$DIGEST" >> build.env
  artifacts:
    reports:
      dotenv: build.env
  needs:
    - build-web
  dependencies:
    - build-web

helm-push:
  stage: deploy
  image: ncr.sky.nhn.no/nhn/ci-deploy:0.0.2
  script: |
    # Set the Helm repository based on the branch
    if [ "$CI_COMMIT_BRANCH" = "main" ]; then
      export HELM_REPO="jonasbg/prism/helm"
    else
      export HELM_REPO="jonasbg/prism/dev"
    fi

    if [ "$CI_COMMIT_BRANCH" = "main" ]; then
      export TAG_SUFFIX="$(date '+%Y%m%d')"
    else
      export TAG_SUFFIX="dev"
    fi

    echo $CI_REGISTRY_PASSWORD | helm registry login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    helm pull oci://$CI_REGISTRY/$HELM_REPO/prism
    file=$(ls prism-*.tgz)
    CURRENT_VERSION=$(echo $file | sed 's/prism-\([0-9]\+\.[0-9]\+\.[0-9]\+\).tgz/\1/')
    export NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{print $1"."$2"."$3+1}')
    echo "NEW CHART VERSION" $NEW_VERSION
    export APP_VERSION=$(awk '/## \[.+\]/{i++} i==2{print; exit}' CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/')
    echo "APP VERSION" $APP_VERSION
    yq e -i '.version = strenv(NEW_VERSION), .appVersion = strenv(APP_VERSION)' $CHART_DIR/Chart.yaml

    export API_TAG="${TAG_SUFFIX}@$API_DIGEST"
    yq e -i '.api.tag = strenv(API_TAG)' $CHART_DIR/values.yaml

    export WEB_TAG="${TAG_SUFFIX}@$WEB_DIGEST"
    yq e -i '.web.tag = strenv(WEB_TAG)' $CHART_DIR/values.yaml

    helm package $CHART_DIR

    # Push the packaged Helm chart
    helm push "${CHART_NAME}-${NEW_VERSION}.tgz" oci://$CI_REGISTRY/$HELM_REPO
  variables:
    CHART_NAME: "prism"
    CHART_DIR: ".cluster/prism"
  dependencies:
    - deploy-web
    - deploy-api
  needs:
    - deploy-web
    - deploy-api
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never