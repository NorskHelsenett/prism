<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-bs-theme="light">
				<script>
					// Immediately invoked function to set the theme
					(function () {
						const theme = localStorage.getItem('theme') || 'light'; // Default to 'light'
						document.body.setAttribute('data-bs-theme', theme);
					})();

					// Listen for theme changes
						window.addEventListener('themeChange', (event) => {
							document.body.setAttribute('data-bs-theme', event.detail);
						});

				</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
	</html>
