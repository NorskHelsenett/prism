roles:
  admin:
    description: "Full access to all resources"
    permissions:
      - resource: "*"
        action: ["*"]
      - resource: "/settings"
        action: ["*"]
  pentester:
    description: "Access to projects and findings"
    permissions:
      - resource: "/project"
        action: ["read", "write", "delete"]
      - resource: "/project/:id"
        action: ["*"]
      - resource: "/slack"
        action: ["read"]
      - resource: "/profile"
        action: ["read"]
      - resource: "/blob"
        action: ["read", "write", "delete"]
      - resource: "/vulnerability"
        action: ["*"]
      - resource: "/vulnerability/:id"
        action: ["*"]
      - resource: "/planning"
        action: ["*"]
      - resource: "/notification"
        action: ["*"]
  visitor:
    description: "Default access to read only"
    permissions:
      - resource: "/project"
        action: ["read"]
      - resource: "/vulnerability"
        action: ["read"]
      - resource: "/profile"
        action: ["read"]
      - resource: "/blob"
        action: ["read"]
      - resource: "/notification"
        action: ["*"]
  global_viewer:
    description: "Read-only access to all resources"
    permissions:
      - resource: "/project"
        action: ["read"]
      - resource: "/project/:id"
        action: ["read"]
      - resource: "/vulnerability"
        action: ["read"]
      - resource: "/vulnerability/:id"
        action: ["read"]
      - resource: "/settings"
        action: [""]
      - resource: "/profile"
        action: ["read"]
      - resource: "/notification"
        action: ["*"]
  manager:
    description: "Access to the planning feature"
    permissions:
      - resource: "/project"
        action: ["read", "write", "delete"]
      - resource: "/project/:id"
        action: ["*"]
      - resource: "/vulnerability"
        action: ["read"]
      - resource: "/vulnerability/:id"
        action: ["read"]
      - resource: "/settings"
        action: [""]
      - resource: "/profile"
        action: ["read"]
      - resource: "/planning"
        action: ["*"]
      - resource: "/notification"
        action: ["*"]
  PET01:
    description: "A new pentester team with write access to only a given project"
    permissions:
      - resource: "/project"
        action: ["*"]
      - resource: "/vulnerability"
        action: ["*"]
      - resource: "/profile"
        action: ["read"]
      - resource: "/notification"
        action: ["*"]
      - resource: "/blob"
        action: ["*"]
  api:
    description: "API token role for what is allowed or not"
    permissions:
      - resource: "/project"
        action: ["read"]
      - resource: "/project/:id"
        action: ["read"]
      - resource: "/vulnerability"
        action: ["read", "write"]
      - resource: "/vulnerability/:id"
        action: ["read", "write"]
      - resource: "/profile"
        action: ["read"]
      - resource: "/planning"
        action: ["read"]
