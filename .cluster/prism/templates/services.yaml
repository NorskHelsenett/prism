apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}-service
spec:
  type: {{ .Values.app.serviceType | default "ClusterIP" }}
  selector:
    app: {{ .Values.app.name }}
  ports:
  {{- range .Values.app.services }}
  {{- if not .internal }}
  - name: {{ .name }}
    port: {{ .port }}
    targetPort: {{ .port }}
  {{- end }}
  {{- end }}
