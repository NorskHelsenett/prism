{{- if .Values.prism.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-ingress
  {{- with .Values.prism.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.prism.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.prism.ingress.tls }}
  tls:
  - hosts:
    - {{ .Values.prism.ingress.host }}
    secretName: {{ .Chart.Name }}-tls-secret
  {{- end }}
  rules:
  - host: {{ .Values.prism.ingress.host }}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: {{ .Chart.Name }}-service
            port:
              number: 8080
{{- end }}